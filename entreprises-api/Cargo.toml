[package]
name = "entreprises-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
default-run = "entreprises-api"

[dependencies]
anyhow = "1.0"
argon2 = "0.6"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header", "with-rejection"] }
deunicode = "1.6"
dotenvy = "0.15"
hex = "0.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_with = "3.23"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "macros", "migrate"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
axum-test = "21.1"
