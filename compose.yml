# Base MariaDB partagée, remplie automatiquement par le service `init`, et API Python (`python-api`).
# L'API Rust tourne hors conteneur (`make run` dans entreprises-api/).
#
#   docker compose up -d      démarre MariaDB (données gardées dans le volume `mariadb-data`),
#                             la remplit (import + comptes de démo), puis lance l'API Python
#   docker compose ps         état ; « healthy » = prête à recevoir des connexions
#   docker compose down       arrête (les données restent)
#   docker compose down -v    arrête et supprime les données
#
# Identifiants de démonstration, identiques à DATABASE_URL et TEST_DATABASE_URL dans entreprises-api/.env.example.

# Nom fixé : sans lui, il viendrait du dossier (« api-rest ») et Docker créerait un nouveau volume, vide.
name: entreprises-api

services:
  mariadb:
    image: mariadb:11.8
    container_name: entreprises-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root-demo
      MARIADB_DATABASE: entreprises
      MARIADB_USER: entreprises
      MARIADB_PASSWORD: entreprises-demo
    ports:
      # Accessible depuis cette machine seulement.
      - "127.0.0.1:3308:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Exécuté une seule fois, à la création du volume : base des tests et droits.
      - ./entreprises-api/docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Remplit la base puis s'arrête : import des 99 999 entreprises et comptes de démonstration.
  # Relancé à chaque `up`, sans risque (modifications PATCH et suppressions conservées).
  # Le premier build compile les commandes Rust : quelques minutes.
  init:
    build:
      context: ./entreprises-api
      dockerfile: docker/init/Dockerfile
    container_name: entreprises-init
    environment:
      DATABASE_URL: mysql://entreprises:entreprises-demo@mariadb:3306/entreprises
    volumes:
      - ./entreprises-api/data:/app/data:ro
    depends_on:
      mariadb:
        condition: service_healthy

  # API Python (FastAPI + pandas) : lit la même base MariaDB que l'API Rust.
  # Swagger : http://127.0.0.1:8001/docs
  python-api:
    build: ./python-api
    container_name: entreprises-python-api
    restart: unless-stopped
    # Même JWT_SECRET et JWT_DUREE_MINUTES que l'API Rust : un token émis par l'une marche sur l'autre.
    env_file: ./entreprises-api/.env
    environment:
      # Remplace celle du .env : dans le réseau Docker, MariaDB s'appelle `mariadb` et écoute sur 3306.
      DATABASE_URL: mysql+pymysql://entreprises:entreprises-demo@mariadb:3306/entreprises
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # Le code est monté : une modification relance l'API sans rebuild.
      - ./python-api/app:/srv/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  mariadb-data:
